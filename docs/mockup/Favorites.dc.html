<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お気に入りアーティスト</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6EE7D0}a:hover{color:#B9F5E9}
input::placeholder{color:#8FA3A9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(circle at 12% 6%, rgba(57,234,195,0.30), transparent 40%), radial-gradient(circle at 92% 38%, rgba(98,82,149,0.38), transparent 45%), radial-gradient(circle at 25% 96%, rgba(0,167,175,0.26), transparent 45%), #0E1A20; color: #EAF4F2; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="margin: 16px 16px 0; height: 56px; box-sizing: border-box; padding: 0 6px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-radius: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<a href="Venue.dc.html" aria-label="会場に戻る" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); color: #EAF4F2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="flex-grow: 1; font-size: 13px; color: #A9BEC4"><strong style="color: #EAF4F2">お気に入り</strong></span>
</header>
<section style="padding: 24px 24px 18px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.08em; color: #6EE7D0">05 — お気に入り</span>
<h1 style="margin: 0; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.3">お気に入りアーティスト</h1>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #A9BEC4">このブラウザに保存されます。ログイン機能の追加後は、アカウントに引き継げます。</p>
</section>
<form onSubmit="{{onSubmit}}" style="margin: 0 16px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 8px">
<label for="artist-input" style="font-size: 13px; font-weight: 700">アーティスト名</label>
<div style="display: flex; gap: 8px">
<input id="artist-input" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="例：アーティスト G" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid rgba(255,255,255,0.22); border-radius: 12px; background: rgba(0,0,0,0.20); color: #EAF4F2; font-size: 15px; font-family: 'Noto Sans JP', sans-serif">
<button type="submit" aria-label="追加" style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0; border: 1px solid rgba(57,234,195,0.6); border-radius: 12px; background: rgba(57,234,195,0.22); color: #EAF4F2; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<span style="font-size: 12px; color: #A9BEC4">全角・半角やカナの表記ゆれは、自動でそろえて照合します。</span>
</form>
<section style="margin: 18px 16px 0; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<h2 style="margin: 0 8px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 15px">登録中（{{count}}組）</h2>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 24px; border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); font-size: 14px; color: #A9BEC4; text-align: center">まだ登録がありません。好きなアーティストを追加してみましょう。</p>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="3">
<li style="height: 56px; box-sizing: border-box; padding: 0 6px 0 18px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); display: flex; align-items: center; gap: 10px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#39EAC3" stroke="#39EAC3" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"></path></svg>
<span style="flex-grow: 1; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 15px">{{item.name}}</span>
<button type="button" onClick="{{item.remove}}" aria-label="{{item.removeLabel}}" style="width: 44px; height: 44px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.10); color: #EAF4F2; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</li>
</sc-for>
</ul>
</section>
<div style="margin: auto 16px 16px; flex-shrink: 0">
<dc-import name="TabBar" active="fav" theme="dark" hint-size="358px,64px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { names: ['アーティスト A', 'アーティスト E', 'アーティスト F'], draft: '' };
}
renderVals() {
const names = this.state.names;
return {
draft: this.state.draft,
count: names.length,
isEmpty: names.length === 0,
items: names.map((name, i) => ({
name: name,
removeLabel: name + ' を削除',
remove: () => this.setState({ names: this.state.names.filter((_, j) => j !== i) })
})),
onDraft: (e) => this.setState({ draft: e.target.value }),
onSubmit: (e) => {
e.preventDefault();
const v = this.state.draft.trim();
if (!v) return;
this.setState({ names: this.state.names.concat([v]), draft: '' });
}
};
}
}
</script>
</body>
</html>
