<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PC用 左ナビ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="メインメニュー" onMouseLeave="{{leave}}" style="position: relative; width: 88px; box-sizing: border-box; padding: 12px 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-radius: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 24px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans JP', sans-serif; color: #EAF4F2">
<a href="DeskMain.dc.html" aria-label="Live Map Checker トップへ" style="height: 56px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#39EAC3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></a>
<div aria-hidden="true" style="position: absolute; left: 8px; top: {{indTop}}; width: 70px; height: 72px; box-sizing: border-box; border-radius: 14px; background: {{indBg}}; border: 1px solid rgba(57,234,195,0.40); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); transition: top 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), background 0.2s; pointer-events: none"></div>
<a href="DeskMain.dc.html" aria-current="{{cur0}}" onMouseEnter="{{h0}}" style="position: relative; z-index: 1; height: 72px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c0}}; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>マップ</a>
<a href="#" aria-current="{{cur1}}" onMouseEnter="{{h1}}" style="position: relative; z-index: 1; height: 72px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c1}}; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"></path></svg>お気に入り</a>
<a href="DeskAccount.dc.html" aria-current="{{cur2}}" onMouseEnter="{{h2}}" style="position: relative; z-index: 1; height: 72px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{c2}}; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>アカウント</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["map","fav","account"],"default":"map"},"$preview":{"width":88,"height":320}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { hover: null };
}
renderVals() {
const base = { map: 0, fav: 1, account: 2 }[this.props.active ?? 'map'] ?? 0;
const pos = this.state.hover != null ? this.state.hover : base;
const on = '#39EAC3', off = '#A9BEC4';
return {
indTop: (12 + 56 + 8 + pos * 78) + 'px',
indBg: pos === base ? 'rgba(57,234,195,0.16)' : 'rgba(57,234,195,0.08)',
c0: pos === 0 ? on : off,
c1: pos === 1 ? on : off,
c2: pos === 2 ? on : off,
cur0: base === 0 ? 'page' : 'false',
cur1: base === 1 ? 'page' : 'false',
cur2: base === 2 ? 'page' : 'false',
h0: () => this.setState({ hover: 0 }),
h1: () => this.setState({ hover: 1 }),
h2: () => this.setState({ hover: 2 }),
leave: () => this.setState({ hover: null })
};
}
}
</script>
</body>
</html>
