name: Deploy

# main への push で CI が成功したときだけ本番にデプロイする（手動実行も可）
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 手動実行、またはこのリポジトリの main への push で CI が成功したときだけ（フォークのコードは決してデプロイしない）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # CI が検査したのと同じコミットをデプロイする
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # マイグレーションは「追加 → 移行 → 削除」の順で分ける（docs/plan.md 9章）ので、古いコードのままでも壊れない
      - run: pnpm db:migrate:prod
      - run: pnpm build
      - run: pnpm exec wrangler deploy
      # シードは新しいコードが動き始めてから流す（新しい取得ルールを指す会場データが、古いコードに渡らないように）
      - run: pnpm db:seed:prod
